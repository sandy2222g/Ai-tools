name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check tools tests debug_agent
      - name: Format check
        run: ruff format --check tools tests debug_agent
      - name: Test (unit)
        run: pytest -m "not docker"
      - name: Test (legacy run_tests suite)
        run: pytest tools/run_tests/test_tool.py

  docker-isolation:
    name: Container isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Build sandbox image
        run: make docker
      - name: Run isolation tests against Docker (fail closed)
        env:
          AI_TOOLS_ISOLATION: docker
        run: pytest -m docker -v

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip-audit --strict

  build:
    name: Build package and verify install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Verify wheel installs and imports in a clean venv
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          cd /tmp && /tmp/verify/bin/python -c "import tools.run_code as r; assert 'ok' in r.run_code('print(\"ok\")', isolation='process')['stdout']"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
