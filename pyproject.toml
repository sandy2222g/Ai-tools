[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-tools"
version = "1.0.0"
description = "Dependency-free, schema-driven tools for LLM agents: sandboxed files, code execution, tests, and research."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Ai-tools maintainers" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
research = ["requests", "beautifulsoup4", "duckduckgo_search"]
agents = ["anthropic", "openai"]
dev = ["pytest>=8", "ruff>=0.4", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = [
    "E501",   # long lines are handled by the formatter
    "S101",   # assert is used in tests
    "S603",   # subprocess is the purpose of run_code/run_tests
    "S607",   # PATH-resolved executables (pytest) are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"tools/run_tests/test_tool.py" = ["S"]
